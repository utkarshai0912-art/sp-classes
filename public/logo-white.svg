<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="whiteNavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="brandAmberGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <!-- SP Monogram Crest -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1.5" />
    
    <!-- Open Book Pages in Amber -->
    <path d="M10 36 C16 32 21 34 24 37 C27 34 32 32 38 36" fill="none" stroke="url(#brandAmberGrad2)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Monogram S -->
    <path d="M15 17 C15 14 18 13 21 13 C24 13 25.5 14.5 25.5 16.5 C25.5 20.5 15 20 15 25 C15 29 18 30 21 30 C24 30 25.5 29 25.5 27" 
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Monogram P -->
    <path d="M30 13 L30 30 M30 13 C35 13 37 14.5 37 18 C37 21.5 35 23 30 23" 
          fill="none" stroke="url(#brandAmberGrad2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Typography "S.P. CLASSES" (Light Mode for Dark BG) -->
  <text x="66" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="-0.02em">S.P. CLASSES</text>
  <text x="67" y="46" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#F59E0B" letter-spacing="0.16em">LEARN • UNDERSTAND • PROGRESS</text>
</svg>
